# Optional paid alternative. Use render.free.yaml for the user's free service.
services:
  - type: web
    name: terralab-api
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: TERRALAB_ENV
        value: production
      - key: TERRALAB_JOB_MODE
        value: supabase
      - key: TERRALAB_RUN_WORKER
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TERRALAB_CORS_ORIGINS
        sync: false
