services:
  - type: web
    name: terralab-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: TERRALAB_ENV
        value: production
      - key: TERRALAB_JOB_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: TERRALAB_CORS_ORIGINS
        sync: false
  - type: worker
    name: terralab-science-worker
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m terralab.worker
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    numInstances: 1
    envVars:
      - key: TERRALAB_ENV
        value: production
      - key: TERRALAB_JOB_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
